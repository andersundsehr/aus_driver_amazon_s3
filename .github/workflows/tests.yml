name: tests

on:
  push:
  pull_request:
  schedule:
    - cron:  '27 4 * * *'

jobs:
  testsuite:
    name: all tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Composer for CI dependency constraints
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      # CI-only alias: TYPO3 still requires ~0.22; 1.0.0 fixes its security advisories.
      # Remove the alias when TYPO3 accepts ^1.0.
      - name: Select security-fixed SVG sanitizer
        run: composer require "enshrined/svg-sanitize:1.0.0 as 0.22.99" --dev --no-update --no-interaction

      - name: Composer
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s composerInstall

      - name: Verify TYPO3 SVG sanitizer compatibility
        run: bash Tests/typo3-svg-sanitizer.sh

      - name: Composer validate
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s composerValidate

      - name: GrumPHP
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s grumphp

      - name: Lint PHP
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s lint

      - name: Unit tests
        run: mkdir -p .Build/Web/typo3conf/ && rm -rf .Build/Web/typo3conf/ext && ln -sfn ../../../../ .Build/Web/typo3conf/ext && Build/Scripts/runTests.sh -p ${{ matrix.php }} -s unit

      - name: Functional tests
        run: mkdir -p .Build/Web/typo3conf/ && rm -rf .Build/Web/typo3conf/ext && ln -sfn ../../../../ .Build/Web/typo3conf/ext && Build/Scripts/runTests.sh -p ${{ matrix.php }} -d sqlite -s functional

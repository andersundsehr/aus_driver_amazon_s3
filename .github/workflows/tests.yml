name: tests

on:
  push:
  pull_request:
  schedule:
    - cron:  '27 4 * * *'

jobs:
  testsuite:
    name: all tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up PHP for dependency resolution
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, gd, zip, pdo_sqlite

      - name: Resolve latest compatible dependencies
        run: composer update --with-all-dependencies --no-install --no-scripts --no-progress --no-interaction

      - name: Composer
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s composerInstall


      - name: Composer validate
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s composerValidate

      - name: GrumPHP
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s grumphp

      - name: Lint PHP
        run: Build/Scripts/runTests.sh -p ${{ matrix.php }} -s lint

      - name: Unit tests
        run: mkdir -p .Build/Web/typo3conf/ && rm -rf .Build/Web/typo3conf/ext && ln -sfn ../../../../ .Build/Web/typo3conf/ext && Build/Scripts/runTests.sh -p ${{ matrix.php }} -s unit

      - name: Functional tests
        run: mkdir -p .Build/Web/typo3conf/ && rm -rf .Build/Web/typo3conf/ext && ln -sfn ../../../../ .Build/Web/typo3conf/ext && Build/Scripts/runTests.sh -p ${{ matrix.php }} -d sqlite -s functional

  lowest-dependencies:
    name: lowest dependencies (PHP 8.2 / TYPO3 13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, gd, zip, pdo_sqlite
      - name: Resolve lowest compatible dependencies
        run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-scripts --no-interaction --no-progress
      - run: composer validate
      - run: composer check-platform-reqs
      - name: Prepare extension test path
        run: mkdir -p .Build/Web/typo3conf/ext && ln -sfn ../../../../ .Build/Web/typo3conf/ext/aus_driver_amazon_s3
      - name: Lint PHP
        run: Build/Scripts/runTests.sh -p 8.2 -s lint
      - name: Static analysis
        run: .Build/bin/phpstan analyse --no-progress
      - name: Unit tests
        run: Build/Scripts/runTests.sh -p 8.2 -s unit
      - name: Functional tests
        run: Build/Scripts/runTests.sh -p 8.2 -d sqlite -s functional
